# Runs the frontend's own checks on the working branch (ADR-0015 readiness gate).
name: CI

on:
  push:
    branches: [Claude-Assisted-Development]
  pull_request:
    branches: [Claude-Assisted-Development]

permissions:
  contents: read

jobs:
  order-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: order-ui/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn test
